[project]
name = "riskradar"
version = "3.0.0"
description = "Track how companies describe their risks in SEC 10-K filings."
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]            # zip(strict=) adds noise here

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]          # long sentences shown in the app

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

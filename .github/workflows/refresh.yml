name: Refresh data

# Once a month: look for new 10-K filings, rebuild the app data and,
# if something changed, push a branch so the change can be reviewed in a pull request.
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Restore downloaded sections and embeddings
        uses: actions/cache@v4
        with:
          path: data/cache
          key: riskradar-cache-${{ github.run_id }}
          restore-keys: riskradar-cache-
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Build
        run: python -m riskradar build
      - name: Check the new data
        run: python -m pytest -q tests/test_data.py
      - name: Push a branch if reports changed
        run: |
          if git diff --quiet -- data/app/reports.csv; then
            echo "No new filings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="update/data-refresh-$(date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/app
          git commit -m "Refresh data: new 10-K filings"
          git push origin "$branch"
          echo "New filings found. Open a pull request for \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
